<script>
/* ===== LUÔN CHẠY BẢN MỚI NHẤT =====
   Mỗi lần deploy, /api/version đổi (Vercel tự sinh theo commit). App so sánh định kỳ:
   thấy khác → tự dọn cache, cập nhật Service Worker và nạp lại. Người dùng không phải
   xoá cache hay bấm gì. Dữ liệu vẫn an toàn vì lưu ở localStorage. */
(function(){
 var CUR=null,busy=false;
 function nowVer(){return fetch('/api/version',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
 function doUpdate(){
  if(busy)return;busy=true;
  try{ if(window.showUpdateToast)window.showUpdateToast(); }catch(e){}
  var jobs=[];
  if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n);}));}).catch(function(){}));
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
   jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.update().catch(function(){});}));}).catch(function(){}));
  Promise.all(jobs).then(function(){setTimeout(function(){location.reload();},600);});
 }
 function check(){
  // Không làm phiền khi đang mở hộp thoại / đang sửa dở
  var m=document.getElementById('modal');
  if(m&&m.classList&&m.classList.contains('open'))return;
  nowVer().then(function(j){
   if(!j||!j.v)return;
   if(CUR===null){CUR=j.v;return;}
   if(j.v!==CUR)doUpdate();
  });
 }
 window.addEventListener('load',function(){
  nowVer().then(function(j){if(j&&j.v)CUR=j.v;});
  setInterval(check,60000);                    // kiểm tra mỗi phút
 });
 document.addEventListener('visibilitychange',function(){if(!document.hidden)check();}); // quay lại tab là kiểm tra
 window.addEventListener('focus',check);
 window.addEventListener('online',check);

 if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
   navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
    reg.update&&reg.update();
    setInterval(function(){reg.update&&reg.update();},60000);
    if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');
    reg.addEventListener&&reg.addEventListener('updatefound',function(){
     var nw=reg.installing;if(!nw)return;
     nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)nw.postMessage('SKIP_WAITING');});
    });
   }).catch(function(){});
  });
  var __swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(__swReloaded)return;__swReloaded=true;location.reload();});
 }
})();
</script>

.hoanhphi::before{top:7px}.hoanhphi::after{bottom:7px}
.cauic::before,.cauic::after{content:'';position:absolute;top:12px;bottom:12px;width:4px;background:repeating-linear-gradient(0deg,rgba(212,175,55,.85) 0 3px,transparent 3px 7px);opacity:.45;pointer-events:none}
.cauic::before{left:4px}.cauic::after{right:4px}
.tho-center{flex:1;max-width:560px;display:flex;flex-direction:column;justify-content:center;text-align:center;color:#fff;padding:10px 6px}

.tho-center p{color:rgba(255,255,255,.86)}
/* Mobile/iPad: VẪN HIỆN 2 câu đối (chỉ thu nhỏ cho vừa màn hình) — không ẩn như trước */
@media(max-width:720px){.tho-frame{padding:12px 8px}.hoanhphi{padding:12px 22px}.hoanhphi .hp-text{font-size:32px}.tho-center h1{font-size:23px}
 .tho-mid{gap:7px}
 /* Chữ Hán phải cách hoa văn viền hai bên, không dính sát */
 .cauic{padding:12px 11px;min-width:0;border-radius:9px}
 .cauic .han{font-size:calc(var(--cau,29px) * .58);line-height:1.28}
 .cauic .med{width:14px;height:14px}
 .cauic::before{left:3px;width:3px}.cauic::after{right:3px;width:3px}
 .tho-center{padding:6px 2px}}
@media(max-width:420px){.cauic{padding:11px 9px}.cauic .han{font-size:calc(var(--cau,29px) * .46)}.cauic::before{left:2px}.cauic::after{right:2px}.hoanhphi .hp-text{font-size:26px}.tho-center h1{font-size:20px}}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}@media(min-width:720px){.quick{grid-template-columns:repeat(6,1fr)}}
.quick a{text-align:center;padding:12px 4px;border-radius:10px;border:1px solid var(--border);background:var(--card)}.quick a:hover{background:var(--accent)}
.quick .qi{font-size:22px}.quick div{font-size:11.5px;font-weight:600;color:var(--primary);margin-top:3px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}.row:first-child{border-top:none}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(212,175,55,.2);color:var(--primary);font-weight:700;font-size:12px;flex-shrink:0;overflow:hidden}
.dot img{width:100%;height:100%;object-fit:cover}
.bar{height:11px;border-radius:99px;background:var(--accent);overflow:hidden}.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.tile{aspect-ratio:4/3;border-radius:9px;border:1px solid rgba(212,175,55,.3);display:grid;place-items:end;padding:6px;color:#fff;font-size:11px;font-weight:600;overflow:hidden;position:relative}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:relative;background:rgba(0,0,0,.4);padding:1px 6px;border-radius:6px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
/* tree */
.treewrap{overflow:auto;padding:10px}
.tree{display:inline-flex;flex-direction:column;align-items:center;transform-origin:top left}
.tnode{display:flex;flex-direction:column;align-items:center;position:relative}
.pcard{display:inline-flex;flex-direction:column;align-items:center;gap:5px;background:linear-gradient(#a81414,#7a0e0e);border:1px solid #e0b84a;border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer;color:#f7e08a}
.pcname{display:flex;flex-direction:column;align-items:center;justify-content:center;height:84px;line-height:1.14;font-size:12.5px;text-align:center;overflow:hidden}
.pcyr{font-weight:400;opacity:.8;font-size:.8em;letter-spacing:0}
.pcard:hover{border-color:var(--gold)}
.pcard.root{background:linear-gradient(#c62828,#8f0f0f);color:#ffe9a8;border-color:#ffd873;box-shadow:0 0 0 1px #ffd873}
.pcard .av{width:24px;height:24px;border-radius:50%;background:rgba(255,240,205,.22);color:#ffe9a8;display:grid;place-items:center;font-size:11px;overflow:hidden}.pcard .av img{width:100%;height:100%;object-fit:cover}
/* Vợ / con gái: ĐẢO màu — nền vàng, chữ đỏ */
.pcard.fem{background:linear-gradient(#f7e08a,#e3ba43);color:#8B0000;border-color:#a81414}
.pcard.fem .av{background:rgba(160,19,19,.16);color:#8B0000}
.kids{display:flex;gap:14px;margin-top:16px;position:relative;align-items:flex-start}
.kids-top{margin-top:0}
.kids-top::before{display:none}
.kids::before{content:'';position:absolute;top:-9px;left:0;right:0;height:2px;background:#a81414}
.vline{width:2px;height:14px;background:#a81414}
.kids>.tnode::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:2px;height:9px;background:#a81414}
.kids-top>.tnode::before{display:none}
.cbtn{width:16px;height:16px;border-radius:50%;border:1px solid var(--gold);background:#fff;color:var(--primary);font-size:10px;line-height:1;cursor:pointer;margin-top:2px}
/* ===== Bản in treo tường (sơ đồ trên nền khung cổ) ===== */
#printWrap{position:fixed;inset:0;z-index:80;background:#39322e;display:none;overflow:auto}
#printWrap.open{display:block}
.pt-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#221d1a;position:sticky;top:0;z-index:5}
.pt-bar>b{color:#f3ecd6;margin-right:6px}
.pt-sheet{position:relative;width:min(96vw,1500px);margin:16px auto 30px;aspect-ratio:3/2;background:#f6edd8;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.55)}
.pt-sheet .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pt-fall{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 42%,#fbf4df 0%,#f4e8c8 60%,#eddfba 100%);border:14px solid #a01313;box-shadow:inset 0 0 0 3px #d4af37,inset 0 0 0 10px #a01313,inset 0 0 60px rgba(160,80,0,.25)}
.pt-fall::after{content:'';position:absolute;inset:10px;border:2px solid rgba(212,175,55,.8);pointer-events:none}
.pt-title{position:absolute;left:50%;top:13.5%;transform:translate(-50%,-50%);width:26%;text-align:center;font-family:'Noto Serif',Georgia,serif;font-weight:800;color:#7a1010;font-size:clamp(11px,1.75vw,30px);line-height:1.12;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.pt-title.noimg{background:linear-gradient(#a01313,#7a0e0e);color:#f5d878;border:2px solid #d4af37;border-radius:10px;padding:.45em .6em;box-shadow:0 4px 14px rgba(0,0,0,.35);top:9%}
.pt-area{position:absolute;left:4.5%;right:4.5%;top:34.5%;bottom:7%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;user-select:none}
.pt-tree{transform-origin:top center}
.pt-sheet .pcard,.trad-wrap .pcard{background:linear-gradient(#a81414,#7a0e0e);border:1.5px solid #e0b84a;color:#f7e08a;cursor:default;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pt-sheet .pcard.root,.trad-wrap .pcard.root{background:linear-gradient(#8B0000,#6d0d0d);color:#ffe9a8;border-color:#d4af37}
.pt-sheet .pcard .av,.trad-wrap .pcard .av{background:rgba(255,240,205,.2);color:#ffe9a8}
.pt-sheet .pcard.fem,.trad-wrap .pcard.fem{background:linear-gradient(#f7e08a,#e3ba43);color:#8B0000;border-color:#a81414}
.pt-sheet .pcard.fem .av,.trad-wrap .pcard.fem .av{background:rgba(160,19,19,.16);color:#8B0000}
.pt-sheet .kids::before,.trad-wrap .kids::before{background:#a81414;height:2px}
.pt-sheet .vline,.trad-wrap .vline{background:#a81414;height:14px;width:2px}
.trad-wrap .pcard{cursor:pointer}
/* nền truyền thống dùng chung */
.trad-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(160,19,19,.35);box-shadow:0 8px 26px rgba(60,20,0,.15);background:#f4ead0}
.pt-sheet .tb-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
/* Banner cuộn thư: dải tỉ lệ cố định (không cắt méo), tên canh đúng ô trên mọi màn hình */
.trad-head{position:relative;width:100%;aspect-ratio:3/1;overflow:hidden;border-bottom:1px solid rgba(160,19,19,.25)}
.trad-head .tb-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.sd-name{position:absolute;left:50.3%;top:31%;transform:translate(-50%,-50%);width:27%;overflow:visible;z-index:3}
.trad-content{position:relative;z-index:2;padding:14px 14px 40px}
.trad-panel{position:relative;background:radial-gradient(90% 70% at 50% 40%,#fbf4df 0%,#f4e8c8 60%,#eddfba 100%);border:12px solid #a01313;box-shadow:inset 0 0 0 3px #d4af37,inset 0 0 0 9px #a01313,0 8px 26px rgba(60,20,0,.18);border-radius:8px;overflow:auto;padding:26px 16px;min-height:56vh;text-align:center}
.trad-panel .tree{transform-origin:top center;margin:0 auto}
/* ===== Sơ đồ gia phả module 3 = GIỐNG HỆT bản in (poster nền ảnh), thêm zoom/kéo ===== */
.pha-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;margin-bottom:6px;border-radius:10px;background:rgba(255,250,235,.9);border:1px solid rgba(201,151,47,.5)}
.pha-title{font-weight:800;color:var(--primary);font-size:15px}
.pha-view{position:absolute;left:4.5%;right:4.5%;top:34.5%;bottom:6%;overflow:hidden;cursor:grab;touch-action:none;z-index:2}
.pha-view.grabbing{cursor:grabbing}
.pha-view.grabbing *{cursor:grabbing!important}
.pha-scene{position:absolute;left:0;top:0;padding:14px 20px 20px 82px;will-change:transform;transform-origin:0 0}
.pha-scene .tree{margin:0}
.pha-hint{position:absolute;right:2%;bottom:2%;z-index:3;font-size:11.5px;color:#7a5a2a;background:rgba(255,250,235,.85);border:1px solid rgba(201,151,47,.5);border-radius:20px;padding:3px 10px;pointer-events:none}
/* Số đời ở đầu mỗi hàng, nằm trên đường sơ đồ */
.gen-label{position:absolute;left:2px;transform:translateY(-50%);background:linear-gradient(#a01313,#7a0e0e);color:#f5d878;border:1px solid #d4af37;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.pha-sheet{position:relative;width:min(100%,1500px);margin:0 auto;aspect-ratio:3/2;background:#f6edd8;overflow:hidden;border-radius:6px;box-shadow:0 10px 34px rgba(60,20,0,.28)}
.pha-sheet>.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Tên trong cuốn thư. Trên điện thoại ảnh nền bị cắt hai bên (object-fit:cover) nên
   cuốn thư to lên — phải nới bề rộng chữ theo, nếu không chữ trông rất nhỏ. */
.pt-name{position:absolute;left:50.3%;top:15.4%;transform:translate(-50%,-50%);width:26%;overflow:visible;z-index:3}
@media(max-width:900px){.pt-name{width:38%}}
@media(max-width:720px){.pt-name{width:52%}}
@media(max-width:480px){.pt-name{width:62%}}
/* Mobile: poster khổ dọc cho vùng cây rộng hơn, dễ xem/kéo trên điện thoại */

@media(max-width:720px){.trad-content{padding:10px 8px 30px}.sd-name{width:36%}}
/* ===== Studio phục chế ảnh ===== */
#psWrap{position:fixed;inset:0;z-index:90;background:#17130f;display:none;flex-direction:column;color:#efe6d8}
#psWrap.open{display:flex}
.ps-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 14px;background:#231d17;border-bottom:1px solid #3a3025}
.ps-top>b{color:#f3d78a}
.ps-main{flex:1;display:flex;min-height:0}
.ps-stagewrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:12px;gap:8px}
.ps-drop{border:2px dashed #6b5a42;border-radius:16px;padding:60px 80px;text-align:center;font-size:17px;color:#cbbba2;cursor:pointer;line-height:1.9}

.ps-stage canvas{display:block;max-width:100%}
#psOwrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#psHandle{position:absolute;top:0;bottom:0;left:50%;width:26px;margin-left:-13px;cursor:ew-resize;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;z-index:4}
#psHandle::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#d4af37;box-shadow:0 0 6px rgba(0,0,0,.7)}
.ps-tag{position:absolute;top:8px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.55);color:#f3d78a;padding:2px 8px;border-radius:6px;z-index:3}
.ps-tag.l{left:8px}.ps-tag.r{right:8px}
.ps-zoombar{display:flex;gap:6px;align-items:center;font-size:12px}
.ubtn2{width:30px;height:30px;border-radius:8px;border:1px solid #4a3e30;background:#2b241d;color:#f3d78a;cursor:pointer;font-size:14px}
.ubtn2:hover{background:#3a3025}
.ps-queue{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-height:86px;overflow:auto}

.ps-queue img.on{border-color:#d4af37;opacity:1}
.ps-side{width:340px;flex:none;overflow:auto;background:#1e1913;border-left:1px solid #3a3025;padding:12px}
.ps-side h4{color:#f3d78a;font-size:13px;margin:12px 0 6px;border-bottom:1px solid #3a3025;padding-bottom:4px}
.ps-side h4:first-child{margin-top:0}
.ps-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.ps-row label{width:96px;flex:none;color:#d8c9ae}
.ps-row input[type=range]{flex:1}
.ps-row output{width:34px;text-align:right;color:#f3d78a}
.ps-bar{height:7px;border-radius:4px;background:#332a20;flex:1;overflow:hidden}
.ps-bar>i{display:block;height:100%;background:linear-gradient(90deg,#d4af37,#b23a3a)}
.ps-pre{display:flex;flex-wrap:wrap;gap:5px}
.ps-pre button{font-size:11.5px;padding:4px 9px;border-radius:8px;border:1px solid #4a3e30;background:#2b241d;color:#e9dcc4;cursor:pointer}
.ps-pre button:hover,.ps-pre button.on{border-color:#d4af37;color:#f3d78a}
.ps-info{font-size:11.5px;color:#bdaa8c;line-height:1.7}
.ps-side textarea{width:100%;background:#141009;color:#e5d9c0;border:1px solid #4a3e30;border-radius:8px;font-size:11.5px;line-height:1.6;padding:8px}
.ps-side select,.ps-side input[type=number]{background:#2b241d;color:#efe6d8;border:1px solid #4a3e30;border-radius:7px;padding:4px 6px;font-size:12px}
@media(max-width:860px){.ps-main{flex-direction:column}.ps-side{width:auto;max-height:46vh;border-left:0;border-top:1px solid #3a3025}}
@media print{#shell,#undobar,#toast,#modal,.pt-bar,#psWrap{display:none!important}#printWrap{display:block!important;position:static;background:#fff;overflow:visible}.pt-sheet{width:100%;margin:0;box-shadow:none;aspect-ratio:auto;height:100vh}}
@page{size:A4 landscape;margin:0}
/* calendar */
.cal{width:100%;border-collapse:collapse;text-align:center;table-layout:fixed}
.cal th{background:var(--accent);padding:6px 0;font-size:12px}
.cal td{border:1px solid var(--border);height:56px;vertical-align:top;padding:3px;font-size:12px}
.cal .d{font-weight:600;color:var(--text);display:flex;align-items:baseline;justify-content:center;gap:3px}
.cal .d .am{font-size:9.5px;font-weight:500;color:#b8860b}
.cal td.td-now{background:rgba(212,175,55,.18);box-shadow:inset 0 0 0 2px var(--gold)}
.cal .ev.gio{background:linear-gradient(#a81414,#7a0e0e);color:#f7e08a;border:1px solid #d4af37}
@media(max-width:720px){.cal td{height:auto;min-height:46px;font-size:11px}.cal .ev{font-size:9.5px}}
.cal .ev{background:var(--primary);color:#fff;border-radius:5px;padding:1px 4px;margin-top:2px;font-size:10.5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal td.today{background:rgba(212,175,55,.15)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
/* Trên điện thoại: dải tab cuộn ngang một hàng (như Google/YouTube) thay vì xuống nhiều dòng chiếm màn hình */
@media(max-width:720px){
 .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
 .tabs::-webkit-scrollbar{display:none}
 .tabs .chip{flex:none;white-space:nowrap}
}
#modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;padding:24px;overflow:auto}#modal.open{display:flex}
#modal .box{background:var(--card);border-radius:14px;max-width:580px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}#modal h3{color:var(--primary);margin-bottom:14px}
#toast{position:fixed;bottom:20px;right:20px;z-index:70;display:flex;flex-direction:column;gap:8px}
#toast div{background:#1c1917;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:sl .2s}
#undobar{position:fixed;right:14px;bottom:72px;z-index:55;display:flex;gap:6px}
.ubtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--primary);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ubtn:hover:not(:disabled){background:var(--accent)}
.ubtn:disabled{opacity:.4;cursor:default}
@keyframes sl{from{transform:translateY(8px);opacity:0}to{opacity:1}}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media print{#sidebar,#mtop,.toolbar,footer{display:none!important}main{max-width:none}}
/* ===== LỚP CHỤP ẢNH riêng — KHÔNG dùng chung #modal để không phá cửa sổ đang mở ===== */
#camWrap{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);padding:16px}
#camWrap.open{display:flex}
.cam-box{width:min(96vw,560px);background:#17130f;border:2px solid var(--gold);border-radius:16px;padding:16px;color:#efe6d8}

.cam-box video{width:100%;border-radius:10px;background:#000;max-height:60vh;object-fit:cover}
.cam-note{font-size:11.5px;color:#bdaa8c;margin-top:8px;line-height:1.6}
/* ===== HOẠT ĐỘNG DIỄN RA — dạng thẻ ===== */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:inset 0 0 0 2px rgba(212,175,55,.16)}

/** Nhãn hiển thị động theo tên gọi đã cấu hình (DB.terms). DB vẫn lưu trường chuẩn. */
/* ===================== NHẬP / XUẤT DÙNG CHUNG CHO MỌI BẢNG =====================
   Một bộ máy duy nhất phục vụ: Thành viên, Quỹ, Hoạt động, Sự kiện, Mộ phần, Thông báo…
   Tiêu đề cột lấy thẳng từ nhãn trong biểu mẫu → người dùng thấy sao thì file y vậy. */
function ioLabel(f){return String(f[1]||f[0]).replace(/\s*\*/,'').replace(/\s*\([^)]*\)\s*$/,'').trim();}
function ioFields(key){const c=CRUD[key];return (c.fields||[]).filter(f=>f[2]!=='image');}
function ioHeaders(key){return ioFields(key).map(ioLabel);}
/* Bỏ dấu để so khớp tiêu đề dù người dùng gõ hoa/thường, có dấu hay không */
function ioNorm(s){return stripVN(String(s||'')).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function ioMap(key){const m={};ioFields(key).forEach(f=>{m[ioNorm(ioLabel(f))]=f;
  m[ioNorm(f[0])]=f;});
 /* vài tên gọi quen thuộc khác */
 const extra={members:{'ho ten':'name','ten':'name','nam sinh':'birthYear'},
  fund:{'noi dung':'name','so tien':'amount','nguoi dong':'person','nguoi nhan':'person','ngay':'date','hang muc':'cat','loai':'type'},
  restoration:{'ten hoat dong':'name','hang muc':'name','du toan':'budget','tien do':'progress','trang thai':'status','phu trach':'owner','loai':'kind'},
  events:{'ten su kien':'title','su kien':'title','ngay':'date','dia diem':'location'},
  graves:{'ho ten':'name','khu mo':'area','vi tri':'location'}}[key]||{};
 Object.keys(extra).forEach(k=>{const f=(CRUD[key].fields||[]).find(x=>x[0]===extra[k]);if(f)m[ioNorm(k)]=f;});
 return m;}
/* ---- XUẤT ---- */
function ioRows(key){ /* tôn trọng tìm kiếm/bộ lọc đang áp dụng */
 if(key==='fund'&&typeof fundRows==='function')return fundRows();
 if(typeof crudRows==='function'&&CRUD[key])return crudRows(key);
 return DB[CRUD[key].store]||[];}
function ioExport(key){const c=CRUD[key];const fs=ioFields(key);const rows=ioRows(key);
 const val=(r,f)=>{const v=r[f[0]];
  if(f[2]==='selectId'){const o=(typeof f[3]==='function'?f[3]():f[3])||[];
   const hit=o.find(x=>Array.isArray(x)?String(x[0])===String(v):false);
   return hit?hit[1]:(typeof memName==='function'&&+v?memName(+v):'');}
  if(f[2]==='check')return v?'x':'';
  return v==null?'':v;};
 const csv='﻿'+[ioHeaders(key)].concat(rows.map(r=>fs.map(f=>val(r,f))))
   .map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
 const b=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=stripVN(c.title).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';a.click();
 toast('Đã xuất '+rows.length+' dòng');}
function ioTemplate(key){const fs=ioFields(key);
 const sample=fs.map(f=>{if(f[2]==='select'){const o=(typeof f[3]==='function'?f[3]():f[3])||[];return o[0]||'';}
  if(f[2]==='number')return '0';if(f[2]==='check')return '';if(/ngày|date/i.test(f[1]))return '01/01/2026';return '';});
 const csv='﻿'+[ioHeaders(key),sample].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
 a.download='mau-'+stripVN(CRUD[key].title).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';a.click();
 toast('Đã tải file mẫu');}
/* ---- NHẬP ---- */
let ioData=null,ioKey='';
function ioImport(key){ioKey=key;ioData=null;
 document.getElementById('modalBox').innerHTML=`<h3>⬆ Nhập ${esc(CRUD[key].title)}</h3>
  <p class="muted" style="font-size:12.5px">Chọn file <b>.xlsx / .xls / .csv</b>. Dòng đầu là tiêu đề cột — không cần đúng thứ tự, không cần dấu.</p>
  <div style="margin:6px 0 10px"><button class="btn btn-o btn-sm" onclick="ioTemplate('${key}')">⬇ Tải file mẫu</button></div>
  <div class="field"><input type="file" accept=".xlsx,.xls,.csv" onchange="ioFile(event)"/></div>
  <div id="ioPrev" class="muted" style="font-size:12.5px;min-height:24px"></div>
  <div class="field"><label><input type="checkbox" id="ioReplace"/> Xóa dữ liệu cũ rồi nhập mới (mặc định là thêm vào)</label></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button class="btn btn-o" onclick="closeModal()">Hủy</button>
   <button class="btn btn-p" id="ioBtn" onclick="ioCommit()" disabled>Nhập</button></div>`;
 document.getElementById('modal').classList.add('open');}
function ioFile(ev){const f=ev.target.files[0];if(!f)return;const prev=document.getElementById('ioPrev');const nm=f.name.toLowerCase();
 if(nm.endsWith('.csv')){const r=new FileReader();r.onload=()=>ioParse(csvParse(r.result));r.readAsText(f,'utf-8');return;}
 loadXLSX(()=>{const r=new FileReader();r.onload=(e)=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
   const ws=wb.Sheets[wb.SheetNames[0]];ioParse(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));}
   catch(err){prev.textContent='⚠ Lỗi đọc Excel: '+err.message;}};r.readAsArrayBuffer(f);},
  ()=>{prev.innerHTML='⚠ Không tải được thư viện đọc Excel. Hãy lưu file dạng <b>CSV UTF-8</b> rồi nhập lại.';});}
function ioParse(arr){const prev=document.getElementById('ioPrev'),btn=document.getElementById('ioBtn');
 if(!arr||arr.length<2){prev.innerHTML='<span style="color:#b23a3a">File trống hoặc thiếu dòng tiêu đề.</span>';btn.disabled=true;return;}
 const map=ioMap(ioKey);const hs=arr[0].map(h=>map[ioNorm(h)]||null);
 const known=hs.filter(Boolean).length;
 if(!known){prev.innerHTML='<span style="color:#b23a3a">Không nhận ra cột nào. Hãy tải file mẫu để xem đúng tiêu đề.</span>';btn.disabled=true;return;}
 const nameKey=CRUD[ioKey].fields[0][0];
 const out=arr.slice(1).filter(r=>r.some(c=>String(c).trim())).map(r=>{const o={};
  hs.forEach((f,i)=>{if(!f)return;let v=r[i];
   /* Số kiểu Việt Nam: "5.000.000đ", "1,200,000", "70%" → lấy đúng phần số */
   if(f[2]==='number'){const raw=String(v==null?'':v).trim();const neg=/^-/.test(raw);
    const d=raw.replace(/[^\d]/g,'');v=d?(neg?-1:1)*(+d):'';}
   else if(f[2]==='check')v=/^(x|1|co|có|true|yes)$/i.test(String(v).trim());
   else if(f[2]==='selectId'){const opts=(typeof f[3]==='function'?f[3]():f[3])||[];
    const s=ioNorm(v);const hit=opts.find(x=>Array.isArray(x)&&ioNorm(x[1])===s);
    v=hit?+hit[0]:0;}
   else v=String(v==null?'':v).trim();
   o[f[0]]=v;});
  return o;}).filter(o=>String(o[nameKey]||'').trim());
 ioData=out;
 const miss=arr[0].filter((h,i)=>!hs[i]&&String(h).trim());
 prev.innerHTML=`✅ Đọc được <b>${out.length}</b> dòng, nhận ra <b>${known}</b> cột.`+
  (miss.length?`<br><span class="muted">Bỏ qua cột không nhận ra: ${esc(miss.join(', '))}</span>`:'');
 btn.disabled=!out.length;}
function ioCommit(){if(!ioData||!ioData.length){toast('Chưa có dữ liệu');return;}
 const c=CRUD[ioKey];const rep=document.getElementById('ioReplace');
 if(rep&&rep.checked){if(!confirm('Xóa toàn bộ '+DB[c.store].length+' dòng cũ của "'+c.title+'" rồi nhập mới?'))return;DB[c.store]=[];}
 ioData.forEach(o=>{const rec=Object.assign({},o);rec.id=nextId(DB[c.store]);
  if(ioKey==='fund'){rec.type=/chi/i.test(stripVN(String(rec.type||'')))?'Chi':'Thu';if(rec.cat)rec.cat=catClean(rec.cat);}
  if(ioKey==='members'&&rec.alive===undefined)rec.alive=!(rec.deathYear||rec.deathAnniv);
  DB[c.store].push(rec);});
 const n=ioData.length;ioData=null;logAct('Nhập '+n+' dòng vào '+c.title);save();closeModal();render();toast('Đã nhập '+n+' dòng');}
window.ioExport=ioExport;window.ioTemplate=ioTemplate;window.ioImport=ioImport;window.ioFile=ioFile;window.ioCommit=ioCommit;

function ioBar(key){const canEd=(typeof curLevel==='function'?curLevel():3)>=2;
 return `${canEd?`<button class="btn btn-o btn-sm" onclick="ioImport('${key}')">⬆ Nhập file</button>`:''}
  <button class="btn btn-o btn-sm" onclick="ioExport('${key}')">⬇ Xuất Excel/CSV</button>`;}

/* ===================== QUỸ CÔNG ĐỨC — LÕI =====================
   MỘT quỹ duy nhất. Phân loại bằng HẠNG MỤC Thu/Chi (quản trị tự thêm/sửa/xóa).
   ĐẶT Ở ĐÂY (cùng khối script với CRUD) vì CRUD dùng ngay các hàm này lúc tải trang. */
const CAT_THU_DEF=['Công đức','Đóng góp','Tài trợ','Khác'];
const CAT_CHI_DEF=['Nhà thờ họ','Hương khói','Tu bổ - xây dựng','Giỗ tổ - lễ hội','Khuyến học','Hiếu hỷ','Người cao tuổi','Từ thiện','Mộ phần','Hoạt động dòng họ','Khác'];
function catThu(){return (DB.fundCats&&DB.fundCats.thu&&DB.fundCats.thu.length)?DB.fundCats.thu:CAT_THU_DEF;}
function catChi(){return (DB.fundCats&&DB.fundCats.chi&&DB.fundCats.chi.length)?DB.fundCats.chi:CAT_CHI_DEF;}
function catAll(){return catThu().concat(catChi());}
/* Ô "Hạng mục" gộp cả Thu và Chi, có tiền tố để dễ nhìn */
function catOpts(){return catThu().map(x=>'↑ '+x).concat(catChi().map(x=>'↓ '+x));}

/* ===== TÌM KIẾM chung cho mọi bảng dữ liệu (Thành viên, Mộ phần, Sự kiện, Quỹ…) =====
   Bỏ dấu tự động: gõ "nguyen van khoan" vẫn ra "Nguyễn Văn Khoan".
   Tìm trên MỌI trường hiển thị + cả tên cha/mẹ/vợ chồng của thành viên. */
let crudQ={};
function crudSearch(key,v){crudQ[key]=v;const box=document.getElementById('crudBody');
 if(box){box.innerHTML=crudTable(key);applyPerms();}}
function crudMatch(key,r,q){
 if(!q)return true;
 const n=stripVN(q).toLowerCase().trim();if(!n)return true;
 // 1) Ưu tiên khớp TÊN: gõ rời từng chữ vẫn ra ("van khoan" → Nguyễn Văn Khoan)
 const name=stripVN(String(r.name||'')).toLowerCase();
 if(n.split(/\s+/).every(p=>name.indexOf(p)>=0))return true;
 // 2) Các trường khác (năm, nơi sinh, ngày giỗ, nghề, cha/mẹ/vợ chồng…): khớp nguyên cụm
 //    → tránh gõ vài chữ ngắn mà ra gần hết danh sách.
 let hay=Object.keys(r).filter(k=>k!=='avatar'&&k!=='id'&&k!=='name').map(k=>r[k]).join(' ');
 if(key==='members')hay+=' '+[memName(r.fatherId),memName(r.motherId),memName(r.spouseId)].join(' ');
 return stripVN(String(hay)).toLowerCase().indexOf(n)>=0;}

let crudF={};
function crudFilter(key,v){crudF[key]=v;const b=document.getElementById('crudBody');if(b){b.innerHTML=crudTable(key);applyPerms();}
 document.querySelectorAll('#crudFilters .chip').forEach(el=>el.classList.toggle('on',el.dataset.f===v));}

const MEM_FILTERS=[['','Tất cả'],['alive','🌿 Còn sống'],['dead','🕯 Đã mất'],['nam','♂ Nam'],['nu','♀ Nữ'],['gio','📅 Có ngày giỗ']];
function crudPass(key,r){const f=crudF[key]||'';if(!f)return true;
 if(key!=='members')return true;
 if(f==='alive')return !!r.alive;
 if(f==='dead')return !r.alive;
 if(f==='nam')return r.gender==='Nam';
 if(f==='nu')return r.gender==='Nữ';
 if(f==='gio')return !!String(r.deathAnniv||'').trim();
 return true;}
function crudRows(key){const c=CRUD[key];const q=crudQ[key]||'';
 const rows=DB[c.store].filter(r=>crudPass(key,r)&&crudMatch(key,r,q));
 if(!q)return rows;
 /* Xếp theo độ liên quan: khớp đúng tên → tên bắt đầu bằng từ khóa → tên có chứa → còn lại */
 const n=stripVN(q).toLowerCase().trim();
 const score=(r)=>{const nm=stripVN(String(r.name||'')).toLowerCase();
  if(nm===n)return 0; if(nm.startsWith(n))return 1; if(nm.indexOf(n)>=0)return 2;
  if(n.split(/\s+/).every(p=>nm.indexOf(p)>=0))return 3; return 4;};
 return rows.map((r,i)=>[score(r),i,r]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]);}
function renderCrud(key){const c=CRUD[key];const all=DB[c.store];const q=crudQ[key]||'';
 return `<div class="h1">${c.icon} ${c.title}</div>

  <tbody>${rows.map(r=>`<tr>${c.columns.map((col,i)=>`<td>${i===0&&(key==='members'||key==='graves')?nameLink(r):cell(r,col)}</td>`).join('')}

      <button class="btn btn-d btn-sm" onclick="del('${key}',${r.id})">🗑</button></td></tr>`).join('')}</tbody></table>`}</div>`;}

const MEM_HMAP={'ho ten':'name','hoten':'name','ho va ten':'name','ten':'name','ho ten day du':'name',
 'gioi tinh':'gender','gioitinh':'gender','nam sinh':'birthYear','namsinh':'birthYear',
 'nam mat':'deathYear','nammat':'deathYear','noi sinh':'birthPlace','que quan':'birthPlace',

 'nghe nghiep':'occupation','dien thoai':'phone','so dien thoai':'phone','sdt':'phone',

 'me':'_mother','ten me':'_mother','mau':'_mother','me de':'_mother','u':'_mother',
 'vo/chong':'_spouse','vo chong':'_spouse','vochong':'_spouse',
 'ban doi':'_spouse','vo':'_spouse','chong':'_spouse','tieu su':'bio','ghi chu':'bio','ghichu':'bio'};
function memMapHeader(h){const k=stripVN(String(h||'')).toLowerCase().trim();if(MEM_HMAP[k])return MEM_HMAP[k];
 if(k===stripVN(T.b1).toLowerCase())return 'branchL1';if(k===stripVN(T.b2).toLowerCase())return 'branch';if(k===stripVN(T.gen).toLowerCase())return 'generation';return null;}
function csvParse(text){const rows=[];let f='',row=[],q=false;text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
  else{if(ch==='"')q=true;else if(ch===','){row.push(f);f='';}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';}else f+=ch;}}
 if(f!==''||row.length){row.push(f);rows.push(row);}return rows;}
function arrToObjs(arr){if(!arr||!arr.length)return [];const hs=arr[0].map(memMapHeader);
 return arr.slice(1).filter(r=>r.some(c=>String(c).trim())).map(r=>{const o={};hs.forEach((k,i)=>{if(k)o[k]=r[i];});return o;});}
function memNum(v){const n=String(v==null?'':v).replace(/\D/g,'');return n?+n:'';}
function memFromRow(o){const g=stripVN(String(o.gender||'')).toLowerCase();
 return {name:String(o.name||'').trim(),gender:g.indexOf('nu')===0?'Nữ':'Nam',
  birthYear:memNum(o.birthYear),deathYear:memNum(o.deathYear),deathAnniv:String(o.deathAnniv||'').trim(),birthPlace:String(o.birthPlace||'').trim(),
  occupation:String(o.occupation||'').trim(),phone:String(o.phone||'').trim(),email:String(o.email||'').trim(),
  address:String(o.address||'').trim(),generation:memNum(o.generation),branchL1:String(o.branchL1||'').trim(),
  branch:String(o.branch||'').trim(),bio:String(o.bio||'').trim(),avatar:'',
  alive:(function(){const a=stripVN(String(o._alive||'')).toLowerCase();if(/mat|chet|qua doi|deceased|died/.test(a))return false;if(/song|con|alive|yes/.test(a))return true;return !(String(o.deathYear||'').trim()||String(o.deathAnniv||'').trim());})(),fatherId:0,spouseId:0,
  _father:String(o._father||'').replace(/^\s*con\s+(trai|gái|gai|gái)\s+\d+\s+/i,'').replace(/\([^)]*\)/g,'').trim(),
  _mother:String(o._mother||'').split(/[\n\r]/)[0].replace(/^\s*\d+\.\s*/,'').replace(/\([^)]*\)/g,'').trim(),
  _spouse:String(o._spouse||'').split(/[\n\r]/)[0].replace(/^\s*\d+\.\s*/,'').replace(/\([^)]*\)/g,'').trim()};}

function memImport(){document.getElementById('modalBox').innerHTML=`<h3>⬆ Nhập danh sách thành viên</h3>
 <p class="muted" style="font-size:12.5px">Chọn file <b>.xlsx / .xls / .csv</b>, dòng đầu là tiêu đề cột. Bấm <b>⬇ Mẫu Excel</b> để tải file mẫu đúng định dạng. Cột <b>Cha</b> và <b>Vợ/Chồng</b> điền <b>họ tên</b> (khớp người đã có hoặc trong cùng file).</p>

function loadXLSX(ok,fail){if(window.XLSX){ok();return;}const s=document.createElement('script');
 s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok();s.onerror=()=>fail&&fail();document.head.appendChild(s);}
function memImportFile(ev){const f=ev.target.files[0];if(!f)return;const prev=document.getElementById('memImpPrev');const nm=f.name.toLowerCase();
 if(nm.endsWith('.csv')){const r=new FileReader();r.onload=()=>memImportParse(arrToObjs(csvParse(r.result)));r.readAsText(f,'utf-8');return;}
 prev.textContent='Đang đọc file Excel…';
 loadXLSX(()=>{const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
   memImportParse(arrToObjs(XLSX.utils.sheet_to_json(ws,{header:1,defval:''})));}catch(e){prev.textContent='⚠ Lỗi đọc Excel: '+e.message;}};r.readAsArrayBuffer(f);},

function memImportParse(objs){const prev=document.getElementById('memImpPrev'),btn=document.getElementById('memImpBtn');
 const list=objs.map(memFromRow).filter(m=>m.name);memImportData=list;
 if(!list.length){prev.innerHTML='<span style="color:#b23a3a">Không có dòng hợp lệ (thiếu cột "Họ tên"?).</span>';btn.disabled=true;return;}
 prev.innerHTML='✅ Đọc được <b>'+list.length+'</b> thành viên. VD: '+list.slice(0,3).map(m=>esc(m.name)+(m.birthYear?' ('+m.birthYear+')':'')).join(', ')+(list.length>3?'…':'')+'<br>Bấm <b>Nhập</b> để thêm vào danh sách.';btn.disabled=false;}
function memImportCommit(){if(!memImportData||!memImportData.length){toast('Chưa có dữ liệu');return;}
 const added=[];
 memImportData.forEach(m=>{const rec=Object.assign({id:nextId(DB.members)},m);delete rec._father;delete rec._mother;delete rec._spouse;DB.members.push(rec);added.push({rec,f:m._father,mo:m._mother,s:m._spouse});});
 const byName=(n)=>{n=stripVN(String(n||'')).toLowerCase().trim();if(!n)return 0;const x=DB.members.find(o=>stripVN(o.name).toLowerCase().trim()===n);return x?x.id:0;};
 let spouseAdded=0;
 added.forEach(a=>{if(a.f)a.rec.fatherId=byName(a.f);
  if(a.mo){let mid=byName(a.mo);
   if(!mid){/* Mẹ chưa có trong danh sách → tạo mới, và ghép làm vợ của cha nếu có cha */
    const mm={id:nextId(DB.members),name:a.mo,gender:'Nữ',birthYear:'',deathYear:'',deathAnniv:'',alive:a.rec.alive,birthPlace:'',occupation:'',phone:'',email:'',address:'',generation:Math.max(1,(+a.rec.generation||1)-1),branchL1:a.rec.branchL1,branch:a.rec.branch,fatherId:0,motherId:0,spouseId:a.rec.fatherId||0,avatar:'',bio:'Mẹ của '+a.rec.name};
    DB.members.push(mm);mid=mm.id;spouseAdded++;
    if(a.rec.fatherId){const fa=DB.members.find(o=>o.id===a.rec.fatherId);if(fa&&!fa.spouseId)fa.spouseId=mid;}}
   a.rec.motherId=mid;}
  if(a.s){let sid=byName(a.s);
   if(!sid){/* Vợ/chồng chưa có trong danh sách → TẠO MỚI để module Gia đình + sơ đồ hiển thị cặp */
    const sg=/thi/.test(stripVN(a.s).toLowerCase())?'Nữ':/van/.test(stripVN(a.s).toLowerCase())?'Nam':(a.rec.gender==='Nam'?'Nữ':'Nam');
    const sp={id:nextId(DB.members),name:a.s,gender:sg,birthYear:'',deathYear:'',deathAnniv:'',alive:a.rec.alive,birthPlace:'',occupation:'',phone:'',email:'',address:'',generation:a.rec.generation,branchL1:a.rec.branchL1,branch:a.rec.branch,fatherId:0,spouseId:a.rec.id,avatar:'',bio:'Vợ/chồng của '+a.rec.name};
    DB.members.push(sp);sid=sp.id;spouseAdded++;}
   a.rec.spouseId=sid;const sp2=DB.members.find(o=>o.id===sid);if(sp2&&!sp2.spouseId)sp2.spouseId=a.rec.id;}});
 memImportData=null;logAct('Nhập '+added.length+' thành viên từ file'+(spouseAdded?' (+'+spouseAdded+' vợ/chồng)':''));save();closeModal();render();toast('Đã nhập '+added.length+' thành viên'+(spouseAdded?' và tạo '+spouseAdded+' vợ/chồng':''));}

 const ex=['Ngành Trưởng','Chi 1','2','Nguyễn Văn Tổ','Trần Thị Tổ','Nguyễn Văn A','Nam','1950','1990','2/2','Đã mất','Hà Nội','Giáo viên','0901234567','a@email.vn','Hà Nội','Trưởng chi 1','Lê Thị B'];

V.events=()=>{const y=calDate.getFullYear(),mo=calDate.getMonth();const first=new Date(y,mo,1);const start=(first.getDay()+6)%7;const days=new Date(y,mo+1,0).getDate();
 const evOf=(d)=>DB.events.filter(e=>{const p=String(e.date).split('/');return +p[0]===d&&+p[1]===mo+1&&+p[2]===y;});

 const today=new Date();const isToday=(d)=>today.getDate()===d&&today.getMonth()===mo&&today.getFullYear()===y;

     </td>`;day++;}}
  cells+='</tr>';}
 const MN=['Một','Hai','Ba','Tư','Năm','Sáu','Bảy','Tám','Chín','Mười','Mười một','Mười hai'];
 return `<div class="h1">📅 Sự kiện thường niên</div><div class="sub">Giỗ tổ, họp họ, lễ tế, mừng thọ, tang lễ — xem trên lịch hoặc danh sách.</div>

 <div class="card pad"><table class="cal"><thead><tr>${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${cells}</tbody></table></div>
 <div class="card" style="overflow:auto;margin-top:12px"><table><thead><tr><th>Ngày</th><th>Sự kiện</th><th>Loại</th><th>Địa điểm</th><th class="right">Sửa</th></tr></thead><tbody>${DB.events.map(e=>`<tr><td>${esc(e.date)}</td><td style="font-weight:500">${esc(e.title)}</td><td><span class="badge badge-gold">${esc(e.type)}</span></td><td>${esc(e.location||'—')}</td><td class="right"><button class="btn btn-o btn-sm" onclick="openForm('events',${e.id})">✎</button> <button class="btn btn-d btn-sm" onclick="del('events',${e.id})">🗑</button></td></tr>`).join('')}</tbody></table></div>`;};

/* ===================== QUỸ CÔNG ĐỨC — GIAO DIỆN =====================
   Một quỹ duy nhất, phân loại theo HẠNG MỤC. Số dư tự cập nhật sau mỗi giao dịch. */
let fundTab='dash', fundQ='', fundFrom='', fundTo='', fundCatF='', fundTypeF='';
const fundMoney=(v)=>vnd(+v||0);
/* Ngày dd/mm/yyyy -> đối tượng so sánh được */
function fdate(v){const m=String(v||'').match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
 return m?new Date(+m[3],+m[2]-1,+m[1]):null;}
function fundAll(){return (DB.fund||[]).slice().sort((a,b)=>{const x=fdate(a.date),y=fdate(b.date);
 return (y?y.getTime():0)-(x?x.getTime():0);});}
/* Lọc theo thời gian, hạng mục, loại và từ khóa */
function fundRows(){const q=stripVN(fundQ).toLowerCase().trim();
 const from=fundFrom?new Date(fundFrom):null, to=fundTo?new Date(fundTo+'T23:59:59'):null;
 return fundAll().filter(x=>{
  if(fundTypeF&&(x.type||'Thu')!==fundTypeF)return false;
  if(fundCatF&&catClean(x.cat)!==fundCatF)return false;
  const d=fdate(x.date);
  if(from&&(!d||d<from))return false;
  if(to&&(!d||d>to))return false;
  if(q){const hay=stripVN([x.name,x.person,x.approver,catClean(x.cat),x.note,x.method,x.amount].join(' ')).toLowerCase();
   if(!q.split(/\s+/).every(p=>hay.indexOf(p)>=0))return false;}
  return true;});}
function fundTotals(rows){const thu=rows.filter(x=>(x.type||'Thu')!=='Chi').reduce((s,x)=>s+(+x.amount||0),0);
 const chi=rows.filter(x=>x.type==='Chi').reduce((s,x)=>s+(+x.amount||0),0);return {thu,chi,du:thu-chi};}
function fundThisMonth(){const n=new Date();return fundAll().filter(x=>{const d=fdate(x.date);
 return d&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();});}
function fundSet(k,v){({q:()=>fundQ=v,from:()=>fundFrom=v,to:()=>fundTo=v,cat:()=>fundCatF=v,type:()=>fundTypeF=v})[k]();
 const b=document.getElementById('fundBody');if(b){b.innerHTML=fundPane();applyPerms();}}
function fundGo(t){fundTab=t;render();}
function fundReset(){fundQ='';fundFrom='';fundTo='';fundCatF='';fundTypeF='';render();}
window.fundSet=fundSet;window.fundGo=fundGo;window.fundReset=fundReset;

function catEnsure(){DB.fundCats=DB.fundCats||{};DB.fundCats.thu=catThu().slice();DB.fundCats.chi=catChi().slice();}
function catAdd(kind){const n=prompt('Tên hạng mục '+(kind==='thu'?'THU':'CHI')+' mới:');if(!n||!n.trim())return;
 catEnsure();if(DB.fundCats[kind].indexOf(n.trim())>=0){toast('Hạng mục đã có');return;}
 DB.fundCats[kind].push(n.trim());logAct('Thêm hạng mục: '+n.trim());save();render();toast('Đã thêm');}
function catEdit(kind,i){catEnsure();const old=DB.fundCats[kind][i];const n=prompt('Đổi tên hạng mục:',old);
 if(!n||!n.trim()||n.trim()===old)return;
 DB.fundCats[kind][i]=n.trim();
 (DB.fund||[]).forEach(x=>{if(catClean(x.cat)===old)x.cat=n.trim();}); /* giữ nguyên dữ liệu cũ */
 logAct('Đổi tên hạng mục: '+old+' → '+n.trim());save();render();toast('Đã đổi tên');}
function catDel(kind,i){catEnsure();const c=DB.fundCats[kind][i];
 const n=(DB.fund||[]).filter(x=>catClean(x.cat)===c).length;
 if(n){alert('Hạng mục "'+c+'" đang có '+n+' giao dịch. Hãy đổi hạng mục của các giao dịch đó trước.');return;}
 if(!confirm('Xóa hạng mục "'+c+'"?'))return;
 DB.fundCats[kind].splice(i,1);logAct('Xóa hạng mục: '+c);save();render();toast('Đã xóa');}
window.catAdd=catAdd;window.catEdit=catEdit;window.catDel=catDel;
/* ---- Biểu đồ đơn giản bằng CSS (không cần thư viện, chạy được khi mất mạng) ---- */
function chartBars(obj,color){const ks=Object.keys(obj);if(!ks.length)return '<p class="muted">Chưa có dữ liệu.</p>';
 const mx=Math.max(1,...ks.map(k=>obj[k]));
 return ks.map(k=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px">
  <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><span class="muted">${fundMoney(obj[k])}</span></div>
  <div class="bar"><i style="width:${obj[k]/mx*100}%;background:${color}"></i></div></div>`).join('');}
/* Biểu đồ tròn vẽ bằng conic-gradient */
function chartPie(obj){const ks=Object.keys(obj).filter(k=>obj[k]>0);if(!ks.length)return '<p class="muted">Chưa có khoản chi.</p>';
 const tot=ks.reduce((s,k)=>s+obj[k],0);const COL=['#a81414','#c9972f','#0f6e56','#7a5a2a','#b23a3a','#557','#8a3a1c','#4a7','#966','#38607a','#8a6d3b'];
 let acc=0;const segs=ks.map((k,i)=>{const a=acc;acc+=obj[k]/tot*360;return `${COL[i%COL.length]} ${a}deg ${acc}deg`;}).join(',');
 return `<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
  <div style="width:150px;height:150px;border-radius:50%;flex:none;background:conic-gradient(${segs});box-shadow:0 3px 12px rgba(0,0,0,.18)"></div>
  <div style="flex:1;min-width:150px">${ks.map((k,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:4px">
    <span style="width:12px;height:12px;border-radius:3px;flex:none;background:${COL[i%COL.length]}"></span>
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span>
    <b>${Math.round(obj[k]/tot*100)}%</b></div>`).join('')}</div></div>`;}

function findRel(){const aid=+document.getElementById('rA').value,bid=+document.getElementById('rB').value;const a=DB.members.find(m=>m.id===aid),b=DB.members.find(m=>m.id===bid);let txt,anceName='';
 if(!a||!b)txt='Không tìm thấy.';else if(aid===bid)txt='Cùng một người.';else if(a.spouseId===bid)txt=`<b>${esc(a.name)}</b> và <b>${esc(b.name)}</b> là <b>vợ/chồng</b>.`;
 else{const ca=anc(aid),cb=anc(bid);let lca=0,da=-1,db=-1;for(let i=0;i<ca.length;i++){const j=cb.indexOf(ca[i]);if(j>=0){lca=ca[i];da=i;db=j;break;}}
  const UP={1:'cha/mẹ',2:'ông/bà',3:'cụ',4:'kỵ'},DW={1:'con',2:'cháu',3:'chắt',4:'chút'};

/* ---- Trợ lý AI: thần số học, Can Chi, chat, chỉnh ảnh ---- */
function stripVN(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');}
function numRed(n){while(n>9&&n!==11&&n!==22)n=String(n).split('').reduce((a,c)=>a+(+c),0);return n;}
const NUMM={1:'độc lập, tiên phong, có tố chất thủ lĩnh',2:'hòa nhã, giỏi kết nối, trọng tình cảm',3:'sáng tạo, giao tiếp tốt, lạc quan',4:'thực tế, kỷ luật, nền tảng vững',5:'ưa tự do, thích thay đổi, thích nghi nhanh',6:'trách nhiệm, yêu gia đình, hay che chở',7:'sâu sắc, ham học hỏi, thiên về nghiên cứu',8:'tham vọng, giỏi quản trị, mạnh về vật chất',9:'nhân ái, bao dung, sống vì cộng đồng',11:'trực giác mạnh, truyền cảm hứng',22:'kiến tạo lớn, biến ý tưởng thành hiện thực'};
const CAN=['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'],CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
const NAPAM=['Hải Trung Kim','Lư Trung Hỏa','Đại Lâm Mộc','Lộ Bàng Thổ','Kiếm Phong Kim','Sơn Đầu Hỏa','Giản Hạ Thủy','Thành Đầu Thổ','Bạch Lạp Kim','Dương Liễu Mộc','Tuyền Trung Thủy','Ốc Thượng Thổ','Tích Lịch Hỏa','Tùng Bách Mộc','Trường Lưu Thủy','Sa Trung Kim','Sơn Hạ Hỏa','Bình Địa Mộc','Bích Thượng Thổ','Kim Bạch Kim','Phú Đăng Hỏa','Thiên Hà Thủy','Đại Trạch Thổ','Thoa Xuyến Kim','Tang Đố Mộc','Đại Khê Thủy','Sa Trung Thổ','Thiên Thượng Hỏa','Thạch Lựu Mộc','Đại Hải Thủy'];
const CHITRAIT={'Tý':'nhanh nhẹn, tháo vát, giỏi xoay xở','Sửu':'bền bỉ, chăm chỉ, đáng tin cậy','Dần':'quả cảm, quyết đoán, có uy','Mão':'ôn hòa, khéo léo, tinh tế','Thìn':'khí phách, nhiều hoài bão','Tỵ':'thâm trầm, mưu lược, sâu sắc','Ngọ':'hoạt bát, phóng khoáng, nhiệt thành','Mùi':'hiền hậu, nghệ sĩ tính, giàu lòng nhân','Thân':'thông minh, linh hoạt, hài hước','Dậu':'cẩn trọng, chu toàn, thẳng thắn','Tuất':'trung thành, nghĩa khí, tận tâm','Hợi':'chân thành, rộng lượng, phúc hậu'};
function canChi(y){y=+y;return {can:CAN[(y+6)%10],chi:CHI[(y+8)%12],menh:NAPAM[Math.floor(((y-4)%60+60)%60/2)]};}
function numerology(name,y){const digits=String(y||'').split('').reduce((a,c)=>a+(+c||0),0);const lp=y?numRed(digits):null;
 const MAP={a:1,j:1,s:1,b:2,k:2,t:2,c:3,l:3,u:3,d:4,m:4,v:4,e:5,n:5,w:5,f:6,o:6,x:6,g:7,p:7,y:7,h:8,q:8,z:8,i:9,r:9};
 let sum=0;stripVN(name).toLowerCase().replace(/[^a-z]/g,'').split('').forEach(c=>sum+=MAP[c]||0);
 return {lp,dest:sum?numRed(sum):null};}function fundBal(){return DB.fund.reduce((a,x)=>a+(x.type==='Thu'?x.amount:-x.amount),0);}
function aiLocalAnswer(q){const n=stripVN(q).toLowerCase();

/* Âm lịch — thuật toán thiên văn Hồ Ngọc Đức (múi giờ +7) */
function jdnOf(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return jd;}
function lcNewMoon(k){const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1-=0.4068*Math.sin(Mpr*dr)-0.0161*Math.sin(dr*2*Mpr);C1-=0.0004*Math.sin(dr*3*Mpr);C1+=0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1-=0.0074*Math.sin(dr*(M-Mpr))-0.0004*Math.sin(dr*(2*F+M));C1-=0.0004*Math.sin(dr*(2*F-M))+0.0006*Math.sin(dr*(2*F+Mpr));C1+=0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));let dt;if(T<-11)dt=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;else dt=-0.000278+0.000265*T+0.000262*T2;return Jd1+C1-dt;}
function lcSunLong(jd){const T=(jd-2451545.0)/36525,T2=T*T,dr=Math.PI/180;const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=(L0+DL)*dr;return L-Math.PI*2*Math.floor(L/(Math.PI*2));}
function lcSunSeg(day,tz,seg){return Math.floor(lcSunLong(day-0.5-tz/24)/Math.PI*seg/2);}
function lcNmDay(k,tz){return Math.floor(lcNewMoon(k)+0.5+tz/24);}
function lcM11(yy,tz){const off=jdnOf(31,12,yy)-2415021,k=Math.floor(off/29.530588853);let nm=lcNmDay(k,tz);if(lcSunSeg(nm,tz,12)>=9)nm=lcNmDay(k-1,tz);return nm;}
function lcLeapOff(a11,tz){const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);let last=0,i=1,arc=lcSunSeg(lcNmDay(k+i,tz),tz,12);do{last=arc;i++;arc=lcSunSeg(lcNmDay(k+i,tz),tz,12);}while(arc!=last&&i<14);return i-1;}
function solar2lunar(dd,mm,yy,tz){tz=tz==null?7:tz;const dayNumber=jdnOf(dd,mm,yy),k=Math.floor((dayNumber-2415021.076998695)/29.530588853);let monthStart=lcNmDay(k+1,tz);if(monthStart>dayNumber)monthStart=lcNmDay(k,tz);let a11=lcM11(yy,tz),b11=a11,lunarYear;
 if(a11>=monthStart){lunarYear=yy;a11=lcM11(yy-1,tz);}else{lunarYear=yy+1;b11=lcM11(yy+1,tz);}
 const lunarDay=dayNumber-monthStart+1,diff=Math.floor((monthStart-a11)/29);let leap=0,lunarMonth=diff+11;
 if(b11-a11>365){const lo=lcLeapOff(a11,tz);if(diff>=lo){lunarMonth=diff+10;if(diff==lo)leap=1;}}
 if(lunarMonth>12)lunarMonth-=12;if(lunarMonth>=11&&diff<4)lunarYear-=1;

function ccDay(jd){const i=(jd+49)%60;return {can:CAN[i%10],chi:CHI[i%12],ci:i%10,xi:i%12};}
function ccMonth(ly,lm){return {can:CAN[(ly*12+lm+3)%10],chi:CHI[(lm+1)%12]};}

const STAR12=['Thanh Long','Minh Đường','Thiên Hình','Chu Tước','Kim Quỹ','Bảo Quang','Bạch Hổ','Ngọc Đường','Thiên Lao','Huyền Vũ','Tư Mệnh','Câu Trận'];

function lcDayStar(lunarM,dayChi){const start=((lunarM-1)%6)*2;const pos=((dayChi-start)+12)%12;return{name:STAR12[pos],hd:HD_SET.includes(pos)};}
function lcInfo(t){const d=t.getDate(),m=t.getMonth()+1,y=t.getFullYear();
 const lu=solar2lunar(d,m,y);const cy=canChi(lu.y),cm=ccMonth(lu.y,lu.m),cd=ccDay(lu.jdn);
 const star=lcDayStar(lu.m,cd.xi);
 const goodH=GIO_HD[cd.xi%6];const badH=[...Array(12).keys()].filter(i=>!goodH.includes(i));
 return{d,m,y,lu,cy,cm,cd,star,goodH,badH,tk:TIETKHI[lcSunSeg(lu.jdn+1,7,24)%24],
  le:LE_AM.find(x=>x[0]===lu.d&&x[1]===lu.m),hol:HOLIDAY.find(x=>x[0]===d&&x[1]===m),
  tamnuong:[3,7,13,18,22,27].includes(lu.d),nguyetky:[5,14,23].includes(lu.d)};}
function lunar2solar(ld,lm,sy){for(let mm=1;mm<=12;mm++)for(let dd=1;dd<=31;dd++){const dt=new Date(sy,mm-1,dd);if(dt.getMonth()+1!==mm)continue;const lu=solar2lunar(dd,mm,sy);if(lu.d===ld&&lu.m===lm&&!lu.leap)return dt;}return null;}
function lcEvParse(ev){const m1=String(ev.date||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m1)return new Date(+m1[3],+m1[2]-1,+m1[1]);
 const m2=String(ev.date||'').match(/Âm lịch\s*(\d{1,2})\/(\d{1,2})/i);if(m2){const t=lunar2solar(+m2[1],+m2[2],new Date().getFullYear());if(t&&t<new Date(Date.now()-864e5))return lunar2solar(+m2[1],+m2[2],new Date().getFullYear()+1)||t;return t;}return null;}
function lcAllEvents(){const yr=new Date().getFullYear();const out=[];
 LE_AM.forEach(x=>{const t=lunar2solar(x[0],x[1],yr)||lunar2solar(x[0],x[1],yr+1);if(t)out.push({t,title:x[2],type:'Lễ truyền thống',src:'le'});});
 DB.events.forEach(ev=>{const t=lcEvParse(ev);if(t)out.push({t,title:ev.title,type:ev.type||'Sự kiện họ',src:'ho',loc:ev.location});});
 return out.sort((a,b)=>a.t-b.t);}
function lcRate(t,purpose){const i=lcInfo(t);let score=5;const why=[];
 if(i.star.hd){score+=3;why.push('Ngày hoàng đạo ('+i.star.name+') — thuận cho việc lành');}
 else{score-=2;why.push('Ngày hắc đạo ('+i.star.name+') — dân gian thường tránh việc lớn');}
 if(i.tamnuong){score-=2;why.push('Ngày Tam nương (âm '+i.lu.d+') — kiêng khởi sự');}
 if(i.nguyetky){score-=2;why.push('Ngày Nguyệt kỵ (âm '+i.lu.d+') — "mùng năm, mười bốn, hăm ba"');}
 if(purpose==='cuoi'&&i.lu.m===7){score-=1;why.push('Tháng 7 âm — dân gian ít cưới hỏi');}
 if(purpose==='antang'&&i.star.hd)why.push('Với tang lễ, chọn giờ hoàng đạo là chính');
 score=Math.max(0,Math.min(10,score));
 return{score,why,label:score>=8?'Rất tốt':score>=6?'Tốt':score>=4?'Bình thường':'Nên tránh',color:score>=8?'#1a7f37':score>=6?'#8a6d00':score>=4?'#666':'#b23a3a'};}

const PS_SLIDERS=[['b','Độ sáng',50,160],['c','Tương phản',50,170],['hl','Vùng sáng',-100,100],['sd','Vùng tối',-100,100],['wb','Cân bằng trắng',-100,100],['sat','Màu sắc',0,200],['ye','Khử ố vàng',0,100],['nr','Khử nhiễu',0,100],['sh','Độ nét',0,100],['gr','Hạt phim',0,60]];

let psList=[],psCur=-1,psZoom=1,psPanX=0,psPanY=0,psSplit=.5,psView='split',psTab='chinh',psTimer=null,psDragH=null,psPan=null,psStyle='historical';

function psAdd(files){[...files].forEach(f=>{if(!/image\//.test(f.type)){toast('Bỏ qua '+f.name+' (định dạng không hỗ trợ)');return;}
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  psList.push({name:f.name,size:f.size,type:f.type,img:im,w:im.width,h:im.height,params:Object.assign({},PS_DEF),hist:[],hi:-1,an:null});
  psCur=psList.length-1;psAnalyze(psCur);psRefresh();psSideRender();};im.src=r.result;};r.readAsDataURL(f);});}

/* ---- phân tích ảnh thật ---- */
function psAnalyze(idx){const it=psList[idx];const w=Math.min(380,it.w),h=Math.round(it.h*w/it.w);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(it.img,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data;const n=w*h;
 let sumL=0,sumL2=0,sumSat=0,sumR=0,sumG=0,sumB=0;const gray=new Float32Array(n);
 for(let i=0;i<n;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];const L=.299*r+.587*g+.114*b;gray[i]=L;sumL+=L;sumL2+=L*L;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);sumSat+=mx?(mx-mn)/mx:0;sumR+=r;sumG+=g;sumB+=b;}
 const meanL=sumL/n,stdL=Math.sqrt(Math.max(0,sumL2/n-meanL*meanL));
 let lap=0,noise=0,cnt=0;
 for(let y=1;y<h-1;y+=2)for(let xx=1;xx<w-1;xx+=2){const i=y*w+xx;
  const v=4*gray[i]-gray[i-1]-gray[i+1]-gray[i-w]-gray[i+w];lap+=v*v;
  const m=(gray[i-1]+gray[i+1]+gray[i-w]+gray[i+w])/4;noise+=Math.abs(gray[i]-m);cnt++;}
 lap/=cnt;noise/=cnt;
 const hist=new Uint32Array(256);for(let i=0;i<n;i++)hist[Math.min(255,Math.round(gray[i]))]++;
 let acc=0,p5=0,p50=128,p95=255,got5=false,got50=false;
 for(let v=0;v<256;v++){acc+=hist[v];if(!got5&&acc>=n*.05){p5=v;got5=true;}if(!got50&&acc>=n*.5){p50=v;got50=true;}if(acc>=n*.95){p95=v;break;}}
 const pct=(v)=>Math.max(0,Math.min(100,Math.round(v)));
 it.an={blur:pct(100-Math.min(100,lap/6)),noise:pct((noise-1.2)*22),fade:pct((0.32-sumSat/n)*380),
  yellow:pct(((sumR+sumG)/2-sumB)/n*1.15),dark:pct((110-meanL)*1.4),bright:pct((meanL-165)*1.6),lowc:pct((52-stdL)*2.6),
  p5,p50,p95,avgR:sumR/n,avgG:sumG/n,avgB:sumB/n,
  mp:(it.w*it.h/1e6).toFixed(1),bpp:(it.size/(it.w*it.h)).toFixed(2)};}
/* ---- pipeline xử lý ---- */
function psPipeline(src,w,h,p){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.filter=`brightness(${p.b}%) contrast(${p.c}%) saturate(${p.bw?0:p.sat}%)`;x.drawImage(src,0,0,w,h);x.filter='none';
 const id=x.getImageData(0,0,w,h),d=id.data,n=w*h;
 const hl=p.hl/100,sd=p.sd/100,wbv=p.wb/100,ye=p.ye/100;
 let blur=null;
 if(p.sh>0||p.nr>0){const bc=document.createElement('canvas');bc.width=w;bc.height=h;const bx=bc.getContext('2d');
  bx.filter='blur('+(p.nr>0?Math.max(1,p.nr/28):1.1)+'px)';bx.drawImage(c,0,0);blur=bx.getImageData(0,0,w,h).data;}
 const shv=p.sh/100*1.15,nrv=p.nr/100*.75;
 for(let i=0;i<n;i++){let r=d[i*4],g=d[i*4+1],b=d[i*4+2];
  if(nrv>0){r+=(blur[i*4]-r)*nrv;g+=(blur[i*4+1]-g)*nrv;b+=(blur[i*4+2]-b)*nrv;}
  if(shv>0){r+=(r-blur[i*4])*shv;g+=(g-blur[i*4+1])*shv;b+=(b-blur[i*4+2])*shv;}
  const L=(.299*r+.587*g+.114*b)/255;
  if(hl){const wgt=L*L;const a=hl*40*wgt;r+=a;g+=a;b+=a;}
  if(sd){const wgt=(1-L)*(1-L);const a=sd*40*wgt;r+=a;g+=a;b+=a;}
  if(wbv){r+=wbv*18;b-=wbv*18;}
  if(ye){const ex=((r+g)/2-b)*ye*.55;r-=ex*.45;g-=ex*.3;b+=ex*.55;}
  if(p.bw){const gl=.299*r+.587*g+.114*b;r=g=b=gl;}
  d[i*4]=r<0?0:r>255?255:r;d[i*4+1]=g<0?0:g>255?255:g;d[i*4+2]=b<0?0:b>255?255:b;}
 x.putImageData(id,0,0);
 if(p.gr>0){const g=p.gr/100;const nc=document.createElement('canvas');nc.width=128;nc.height=128;const nx=nc.getContext('2d');
  const nd=nx.createImageData(128,128);for(let i=0;i<128*128;i++){const v=128+(Math.random()-.5)*255;nd.data[i*4]=nd.data[i*4+1]=nd.data[i*4+2]=v;nd.data[i*4+3]=255;}
  nx.putImageData(nd,0,0);x.globalAlpha=g*.35;x.globalCompositeOperation='overlay';
  for(let yy=0;yy<h;yy+=128)for(let xx=0;xx<w;xx+=128)x.drawImage(nc,xx,yy);
  x.globalAlpha=1;x.globalCompositeOperation='source-over';}
 return c;}
function psRefresh(){const it=psImg();const stage=document.getElementById('psStage'),drop=document.getElementById('psDrop');
 document.getElementById('psZoomBar').style.display=it?'flex':'none';
 if(!it){stage.style.display='none';drop.style.display='block';psQueueRender();return;}
 drop.style.display='none';stage.style.display='block';
 const wrap=document.getElementById('psStageWrap');
 const maxW=wrap.clientWidth-24,maxH=wrap.clientHeight-140;
 const sc=Math.min(1,maxW/it.w,maxH/it.h);const w=Math.max(1,Math.round(it.w*sc)),h=Math.max(1,Math.round(it.h*sc));
 const out=psPipeline(it.img,w,h,it.params);
 const C=document.getElementById('psC');C.width=w;C.height=h;C.getContext('2d').drawImage(out,0,0);
 const O=document.getElementById('psO');O.width=w;O.height=h;O.getContext('2d').drawImage(it.img,0,0,w,h);

function psSched(){clearTimeout(psTimer);psTimer=setTimeout(psRefresh,120);}
function psSet(k,v){const it=psImg();if(!it)return;it.params[k]=+v;psSched();}
function psCommit(){const it=psImg();if(!it)return;it.hist=it.hist.slice(0,it.hi+1);it.hist.push(JSON.stringify(it.params));it.hi=it.hist.length-1;}
function psUndo(){const it=psImg();if(!it||it.hi<0)return;const cur=JSON.stringify(it.params);
 if(it.hist[it.hi]===cur&&it.hi>0)it.hi--;it.params=JSON.parse(it.hist[it.hi]);if(it.hi>0)it.hi--;psRefresh();psSideRender();}
function psRedo(){const it=psImg();if(!it||it.hi>=it.hist.length-1)return;it.hi++;it.params=JSON.parse(it.hist[it.hi]);psRefresh();psSideRender();}
function psPreset(key){const it=psImg();if(!it)return;psCommit();
 if(key==='auto'){const a=it.an||{};const p=Object.assign({},PS_DEF);const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(v)));
  /* auto-levels theo trung vị & percentile như chuyên gia chỉnh Levels */
  if(a.p50)p.b=cl(100*128/Math.max(60,a.p50),88,132);
  const spread=Math.max(30,(a.p95||255)-(a.p5||0));p.c=cl(100*195/spread,98,145);
  /* gray-world white balance: lệch kênh đỏ-lam → kéo về trung tính */
  if(a.avgR!=null){const cast=a.avgR-a.avgB;if(Math.abs(cast)>6)p.wb=cl(-cast*.8,-40,40);}
  if(a.yellow>12)p.ye=cl(a.yellow*1.3,0,75);
  p.sat=a.fade>15?cl(100+a.fade/2,100,138):104;
  if(a.noise>18)p.nr=cl(a.noise*1.1,0,55);
  p.sh=a.blur>20?cl(a.blur*.9,15,75):15;
  if(a.dark>25)p.sd=cl(a.dark/3,0,30);
  if(a.bright>25)p.hl=-cl(a.bright/3,0,25);

 const dmg=[];if(a.blur>30)dmg.push('ảnh mờ/nét kém');if(a.noise>25)dmg.push('nhiễu hạt');if(a.yellow>20)dmg.push('ố vàng');if(a.fade>25)dmg.push('bạc màu');if(a.lowc>20)dmg.push('tương phản thấp');if(a.dark>25)dmg.push('thiếu sáng');

KHÔNG ĐƯỢC:

Phong cách: ${styleName}, chân thực lịch sử, tự nhiên như ảnh gốc được bảo quản tốt.`;}

async function psAIRestore(){const it=psImg();if(!it)return;const ai=DB.settings.ai||{};
 const st=document.getElementById('psAIStatus');
 if(!ai.key){st.innerHTML='Cần API key (Cài đặt → AI).';return;}

 try{const blob=await new Promise(res=>{const c=psPipeline(it.img,Math.min(1536,it.w),Math.round(Math.min(1536,it.w)*it.h/it.w),it.params);c.toBlob(res,'image/png');});
  const fd=new FormData();fd.append('model','gpt-image-1');fd.append('image',blob,'photo.png');fd.append('prompt',psPrompt());
  const r=await fetch('https://api.openai.com/v1/images/edits',{method:'POST',headers:{'Authorization':'Bearer '+ai.key},body:fd});
  const j=await r.json();if(j.error)throw new Error(j.error.message);
  const b64=j.data[0].b64_json;const im=new Image();im.onload=()=>{psList.push({name:'AI · '+it.name,size:Math.round(b64.length*.75),type:'image/png',img:im,w:im.width,h:im.height,params:Object.assign({},PS_DEF),hist:[],hi:-1,an:null});psCur=psList.length-1;psAnalyze(psCur);psRefresh();psSideRender();toast('AI phục chế xong — đã thêm vào hàng đợi');};
  im.src='data:image/png;base64,'+b64;st.innerHTML='✅ Xong — ảnh AI nằm cuối hàng đợi.';
 }catch(e){st.innerHTML='⚠ '+esc(e.message);}}

 const psOn=document.getElementById('psWrap')&&document.getElementById('psWrap').classList.contains('open');

 else if(k==='y'||(k==='z'&&e.shiftKey)){if(inField)return;e.preventDefault();psOn?psRedo():doRedo();}});
